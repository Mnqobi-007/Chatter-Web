<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatter - Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/api/css/style.css" />
</head>
<body class="chat-page">
    <div class="chat-app">
        <!-- Sidebar -->
        <div class="chat-sidebar" id="chatSidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar avatar-lg">
                        <img src="https://i.pravatar.cc/50?img=11" alt="Your avatar" id="currentUserAvatar" />
                    </div>
                    <div class="user-info">
                        <h3 id="currentUsername">Username</h3>
                        <span class="user-status online">Online</span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="icon-btn" id="addContactBtn" title="Add Contact">
                        <i class="fas fa-user-plus"></i>
                    </button>
                    <button class="icon-btn" id="logoutBtn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>

            <div class="sidebar-search">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search contacts..." id="searchContacts" />
                </div>
            </div>

            <div class="sidebar-tabs">
                <button class="tab-btn active" data-tab="all"><i class="fas fa-users"></i> All</button>
                <button class="tab-btn" data-tab="online"><i class="fas fa-circle"></i> Online</button>
                <button class="tab-btn" data-tab="unread"><i class="fas fa-envelope"></i> Unread</button>
            </div>

            <div class="contact-list" id="contactList">
                <div class="contact-loading">
                    <div class="loader"></div>
                    <p>Loading contacts...</p>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon"><i class="fas fa-comment-dots"></i></div>
                <h2>Select a contact</h2>
                <p>Choose a contact to start chatting</p>
            </div>

            <!-- Active Chat -->
            <div class="active-chat hidden" id="activeChat">
                <div class="chat-header" id="chatHeader">
                    <div class="chat-contact">
                        <div class="avatar">
                            <img src="" alt="Contact avatar" id="chatContactAvatar" />
                            <span class="status-indicator" id="chatContactStatus"></span>
                        </div>
                        <div class="contact-info">
                            <h3 id="chatContactName">Contact Name</h3>
                            <span class="contact-status" id="chatContactStatusText">Online</span>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="icon-btn" title="Call"><i class="fas fa-phone"></i></button>
                        <button class="icon-btn" title="Video"><i class="fas fa-video"></i></button>
                        <button class="icon-btn" title="More"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be dynamically loaded -->
                </div>

                <div class="chat-input-wrapper">
                    <div class="chat-input-actions">
                        <button class="icon-btn" id="attachFileBtn" title="Attach file"><i class="fas fa-paperclip"></i></button>
                        <input type="file" id="fileInput" hidden accept="image/*,.pdf,.doc,.docx,.txt">
                        <button class="icon-btn" title="Emoji"><i class="fas fa-smile"></i></button>
                    </div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
                        <button class="send-btn" id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Contact Modal -->
    <div class="modal" id="addContactModal">
        <div class="modal-content modal-sm">
            <button class="modal-close" id="addContactModalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-icon"><i class="fas fa-user-plus"></i></div>
                <h2>Add Contact</h2>
                <p>Enter the username of the person you want to chat with</p>
            </div>
            <form id="addContactForm" class="modal-form">
                <div class="form-group">
                    <label for="contactUsername"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="contactUsername" placeholder="Enter username" required />
                </div>
                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-plus-circle"></i> Add Contact
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/api/js/auth.js"></script>
    <script src="/api/js/chat.js"></script>
</body>
</html>
