<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Chatter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/api/css/style.css" />
</head>
<body>
    <div class="hero" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
        <div class="modal" style="display:flex; position:relative; background:transparent; backdrop-filter:none;">
            <div class="modal-content" style="max-width:440px; margin:0 auto;">
                <div class="modal-header">
                    <div class="modal-icon"><i class="fas fa-comment-dots"></i></div>
                    <h2>Welcome Back</h2>
                    <p>Login to continue chatting with your friends</p>
                </div>
                <form id="loginForm" class="modal-form">
                    <div class="form-group">
                        <label for="loginUsername"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username" required />
                    </div>
                    <div class="form-group">
                        <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-input">
                            <input type="password" id="loginPassword" placeholder="Enter your password" required />
                            <button type="button" class="toggle-password"><i class="fas fa-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    <p class="form-footer">
                        Don't have an account? <a href="/signup">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="/api/js/auth.js"></script>
</body>
</html>
