<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Chatter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/api/css/style.css" />
</head>
<body>
    <div class="hero" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
        <div class="modal" style="display:flex; position:relative; background:transparent; backdrop-filter:none;">
            <div class="modal-content" style="max-width:440px; margin:0 auto;">
                <div class="modal-header">
                    <div class="modal-icon"><i class="fas fa-comment-dots"></i></div>
                    <h2>Create Account</h2>
                    <p>Join the community and start messaging</p>
                </div>
                <form id="signupForm" class="modal-form">
                    <div class="form-group">
                        <label for="signupUsername"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="signupUsername" placeholder="Choose a username" required />
                    </div>
                    <div class="form-group">
                        <label for="signupEmail"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required />
                    </div>
                    <div class="form-group">
                        <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-input">
                            <input type="password" id="signupPassword" placeholder="Create a password" required />
                            <button type="button" class="toggle-password"><i class="fas fa-eye"></i></button>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar"></div>
                            <span class="strength-text">Password strength: Weak</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signupConfirmPassword"><i class="fas fa-check-circle"></i> Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required />
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                    <p class="form-footer">
                        Already have an account? <a href="/login">Login</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="/api/js/auth.js"></script>
</body>
</html>
