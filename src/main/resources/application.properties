# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ===============================
# SPRING APPLICATION
# ===============================
spring.application.name=chatting-website

# ===============================
# DATABASE CONFIGURATION (H2)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/chatter_db;MODE=MySQL;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===============================
# CACHE CONFIGURATION (Caffeine)
# ===============================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=3600s,recordStats

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=/tmp

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=c2VjcmV0LWtleS1mb3ItY2hhdHRlci1hcHAtc2hvdWxkLWJlLWF0LWxlYXN0LTMyLWNoYXJhY3RlcnMtbG9uZw==
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=chatter-app
jwt.header=Authorization
jwt.prefix=Bearer 

# ===============================
# FILE STORAGE CONFIGURATION
# ===============================
file.upload.directory=./uploads
file.upload.max-size=10485760
file.upload.allowed-extensions=.jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.txt
file.upload.allowed-content-types=image/jpeg,image/png,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain

# ===============================
# WEBSOCKET CONFIGURATION
# ===============================
websocket.endpoint=/ws
websocket.allowed-origins=http://localhost:3000,http://localhost:4200
websocket.message-buffer-size=512000
websocket.send-timeout=10000

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.chatter=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# ACTUATOR / MANAGEMENT
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,cache,threaddump
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.metrics.export.simple.enabled=true

# ===============================
# APPLICATION SPECIFIC
# ===============================
app.chat.max-message-length=1000
app.chat.max-history-messages=100
app.chat.typing-timeout=3000
app.chat.rate-limit.messages-per-minute=60
app.security.password-encoder-strength=10
app.security.session-timeout=3600
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===============================
# SPRING SECURITY
# ===============================
spring.security.user.name=admin
spring.security.user.password=admin123

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true